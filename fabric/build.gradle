plugins {
    id 'com.blamejared.loader-plugin'
    id 'net.fabricmc.fabric-loom'
}

loom {
    def aw = project(':common').file("src/main/resources/${modid}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        named('client') {
            client()
            configName('Fabric Client')
            ideConfigGenerated(true)
            runDir('run')
        }
    }
}

repositories {
    maven { url = "https://maven.terraformersmc.com/" }
    maven { url = "https://maven.shedaniel.me/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft}"
    implementation "net.fabricmc:fabric-loader:${project.fabric_loader}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric}"

    implementation "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}", {
        exclude module: 'fabric-api'
    }
    implementation "com.terraformersmc:modmenu:${project.modmenu_version}", {
        exclude module: 'fabric-api'
    }
}

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}