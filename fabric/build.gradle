plugins {
    id 'com.blamejared.loader-plugin'
    id 'net.fabricmc.fabric-loom'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric}"
}

loom {
    def aw = project(':common').file("src/main/resources/${modid}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        named('client') {
            client()
            configName('Fabric Client')
            ideConfigGenerated(true)
            runDir('run')
        }
    }
}

repositories {
    /*
    maven {
        name = 'Xander Maven'
        url = 'https://maven.isxander.dev/releases'
    }
    maven {
        name = 'ModMenu'
        url = 'https://maven.terraformersmc.com/releases/'
    }
    */
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft}"
    implementation "net.fabricmc:fabric-loader:${project.fabric_loader}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric}"

    /*
    implementation "com.terraformersmc:modmenu:${project.modmenu_version}"
    implementation "dev.isxander:yet-another-config-lib:${project.yacl_version}"
     */
}

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}